<!-- Clean Portfolio App Template -->
<div class="min-h-screen bg-gray-50">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="grid grid-cols-3 items-center h-16">

        <!-- Logo/Name - Left Column -->
        <div class="flex justify-start">
          <h1 class="text-xl font-bold text-gray-900">Giusippi Maria II D. Apa</h1>
        </div>

        <!-- Navigation - Center Column (truly centered) -->
        <nav class="flex justify-center space-x-4">
          <button mat-button (click)="scrollToSection('about')" class="text-gray-700 hover:text-blue-600">About</button>
          <button mat-button (click)="scrollToSection('projects')" class="text-gray-700 hover:text-blue-600">Projects
          </button>
          <button mat-button (click)="scrollToSection('contact')" class="text-gray-700 hover:text-blue-600">Contact
          </button>
        </nav>

        <!-- Right Column - Empty for now, keeps navigation centered -->
        <div class="flex justify-end">
          <!-- Future: Could add theme toggle, user menu, etc. -->
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1">

    <!-- Hero Section -->
    <app-hero></app-hero>

    <!-- Projects Section -->
    <app-projects></app-projects>

    <!-- About Section -->
    <app-about></app-about>

    <!-- Contact Section -->
    <app-contact></app-contact>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center">
        <p class="text-gray-400">
          Built with Angular {{ angularVersion }} + Material + Tailwind CSS
        </p>
      </div>
    </div>
  </footer>

</div>

<!-- Router Outlet for future routing -->
<router-outlet />
