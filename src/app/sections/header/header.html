<!-- Modern Responsive Header Navigation -->
<header
  class="animated-gradient bg-gradient-to-r from-white via-gray-50 to-white dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 shadow-lg border-b border-gray-100 dark:border-gray-700 sticky top-0 z-50 backdrop-blur-sm bg-white/95 dark:bg-gray-900/95 transition-all duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 lg:h-20">

      <!-- Logo/Brand - Left -->
      <div class="flex items-center space-x-3 group">
        <div class="relative">
          <img src="images/logo.svg" alt="Logo"
               class="h-10 w-auto lg:h-12 transition-transform duration-300 group-hover:scale-105 drop-shadow-sm group-hover:drop-shadow-md">
          <div
            class="absolute inset-0 bg-blue-500/20 rounded-full blur-xl opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </div>
        <div>
          <h1 class="text-apa-holographic text-xl lg:text-2xl font-bold cursor-default select-none">
            Apa
          </h1>
        </div>
      </div>

      <!-- Desktop Navigation - Always visible except on very small screens -->
      <nav class="hidden mobile-only:hidden flex items-center space-x-1 lg:space-x-2">
        <button
          mat-button
          (click)="scrollToSection('projects')"
          class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-all duration-300 relative group rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2">
          <mat-icon class="mr-2 text-sm">work</mat-icon>
          Projects
          <span
            class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-gradient-to-r from-blue-500 to-blue-600 transition-all duration-300 group-hover:w-3/4 transform -translate-x-1/2"></span>
        </button>

        <button
          mat-button
          (click)="scrollToSection('about')"
          class="px-4 py-2 text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 font-medium transition-all duration-300 relative group rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2">
          <mat-icon class="mr-2 text-sm">person</mat-icon>
          About
          <span
            class="absolute bottom-0 left-1/2 w-0 h-0.5 bg-gradient-to-r from-blue-500 to-blue-600 transition-all duration-300 group-hover:w-3/4 transform -translate-x-1/2"></span>
        </button>
      </nav>

      <!-- Right Side - Theme Toggle, CTA & Mobile Menu -->
      <div class="flex items-center space-x-3">

        <!-- Theme Toggle Button -->
        <button
          mat-icon-button
          (click)="themeService.toggleTheme()"
          [attr.aria-label]="'Switch to ' + themeService.getThemeLabel()"
          class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200 focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2">
          <mat-icon class="text-gray-600 dark:text-gray-300">{{ themeService.getThemeIcon() }}</mat-icon>
        </button>

        <!-- CTA Button (Always visible except very small screens) -->
        <button
          mat-raised-button
          (click)="scrollToSection('contact')"
          class="cta-shimmer hidden mobile-only:hidden flex items-center px-6 py-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-300 hover:from-blue-700 hover:to-blue-800 focus-visible:outline-2 focus-visible:outline-blue-300 focus-visible:outline-offset-2">
          <mat-icon class="mr-2 text-sm">send</mat-icon>
          Get In Touch
        </button>

        <!-- Mobile Menu Button (Only on very small mobile screens) -->
        <button
          mat-icon-button
          (click)="toggleMobileMenu()"
          class="mobile-only:block hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200 focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2"
          [attr.aria-expanded]="isMobileMenuOpen"
          aria-label="Toggle navigation menu">
          <mat-icon class="transition-transform duration-300 text-gray-600 dark:text-gray-300"
                    [class.rotate-90]="isMobileMenuOpen">
            {{ isMobileMenuOpen ? 'close' : 'menu' }}
          </mat-icon>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation Menu (Only on very small mobile screens) -->
    <div class="mobile-only:block hidden overflow-hidden transition-all duration-300 ease-in-out"
         [class.max-h-0]="!isMobileMenuOpen"
         [class.max-h-96]="isMobileMenuOpen">
      <nav
        class="py-4 space-y-3 border-t border-gray-100 dark:border-gray-700 bg-gradient-to-b from-gray-50 to-white dark:from-gray-800 dark:to-gray-900">

        <!-- Theme Toggle in Mobile Menu -->
        <div class="px-4">
          <button
            mat-button
            (click)="themeService.toggleTheme(); closeMobileMenu()"
            class="mobile-nav-item w-full flex items-center justify-center py-3 text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all duration-200 rounded-lg focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2">
            <mat-icon class="mr-3 text-blue-500">{{ themeService.getThemeIcon() }}</mat-icon>
            <span class="font-medium">{{ themeService.getThemeLabel() }}</span>
          </button>
        </div>

        <!-- Mobile Navigation Items - Properly Centered -->
        <div class="px-4">
          <button
            mat-button
            (click)="scrollToSection('projects'); closeMobileMenu()"
            class="mobile-nav-item w-full flex items-center justify-center py-3 text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all duration-200 rounded-lg focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2">
            <mat-icon class="mr-3 text-blue-500">work</mat-icon>
            <span class="font-medium">Projects</span>
          </button>
        </div>

        <div class="px-4">
          <button
            mat-button
            (click)="scrollToSection('about'); closeMobileMenu()"
            class="mobile-nav-item w-full flex items-center justify-center py-3 text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-all duration-200 rounded-lg focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-2">
            <mat-icon class="mr-3 text-blue-500">person</mat-icon>
            <span class="font-medium">About</span>
          </button>
        </div>

        <!-- Mobile CTA - Consistently Centered -->
        <div class="px-4">
          <button
            mat-raised-button
            (click)="scrollToSection('contact'); closeMobileMenu()"
            class="mobile-nav-item cta-shimmer w-full flex items-center justify-center py-3 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold rounded-lg shadow-md focus-visible:outline-2 focus-visible:outline-blue-300 focus-visible:outline-offset-2">
            <mat-icon class="mr-2">send</mat-icon>
            <span>Get In Touch</span>
          </button>
        </div>
      </nav>
    </div>
  </div>
</header>
