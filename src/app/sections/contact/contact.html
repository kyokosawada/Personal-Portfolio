<section id="contact" class="py-16 bg-gray-50 dark:bg-gray-800 transition-colors duration-500">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h2 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-6">Let's Work Together</h2>
    <p class="text-xl text-gray-600 dark:text-gray-300 mb-12">
      Ready to start your next project? I'm Giusippi Maria II D. Apa, and I'm available for freelance work and would
      love to hear about your ideas.
    </p>

    <!-- Contact Options -->
      <div class="flex justify-center mb-12">

      <!-- Email -->
        <mat-card class="p-6 hover:shadow-lg transition-shadow cursor-pointer bg-white dark:bg-gray-700 max-w-sm w-full"
                (click)="openEmail()">
        <div class="flex items-center justify-center mb-4">
          <div class="bg-blue-100 dark:bg-blue-900/30 p-3 rounded-full">
            <mat-icon class="text-blue-600 dark:text-blue-400 text-2xl">email</mat-icon>
          </div>
        </div>
        <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">Email</h3>
        <p class="text-gray-600 dark:text-gray-300">{{ emailAddress }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">Click to send email</p>
      </mat-card>

    </div>


      <!-- Availability Status -->
    <div class="bg-green-50 dark:bg-gray-800 border border-green-200 dark:border-gray-700 rounded-lg p-4 inline-block">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-green-500 dark:bg-green-400 rounded-full animate-pulse"></div>
            <span class="text-green-800 dark:text-green-200 font-medium">Currently available for new projects</span>
          </div>
      </div>

  </div>
</section>
